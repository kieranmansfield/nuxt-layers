shamefullyHoist: true
strictPeerDependencies: false
# pnpm-workspace.yaml

packages:
  - 'apps/*'
  - 'layers/*'
  - 'layers/*/*'
  - 'layers/*/*/providers/*'
  - 'layers/*/providers/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': true
  'better-sqlite3': true
  'esbuild': true
  netlify-cli: true
  'sharp': true
  'sqlite3': true
  unix-dgram: true
  'unrs-resolver': true
  'vue-demi': true

minimumReleaseAgeExclude:
  - '@netlify/nuxt'
  - '@vue/language-core'
  - vue-tsc
  - '@types/node'
  - '@nuxt/kit@4.4.7'
  - '@nuxt/nitro-server@4.4.7'
  - '@nuxt/schema@4.4.7'
  - '@nuxt/vite-builder@4.4.7'
  - nuxt@4.4.7
  - '@playwright/test@1.61.0'
  - skills@1.5.10
  - eslint-plugin-vue@10.9.2
  - pnpm@11.5.3
  - '@voidzero-dev/vite-plus-core@1.3.0'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.3.0'
  - '@voidzero-dev/vite-plus-darwin-x64@1.3.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.3.0'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.3.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.3.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.3.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.3.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.3.0'
  - vite-plus@1.3.0


name: Update Browserslist DB

on:
  schedule:
    - cron: "0 0 1 * *" # 1st of every month
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-browserslist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          # The action rebases the existing browserslist-update branch onto main. With the
          # default shallow clone main looks like one unrelated commit, so every file
          # add/add-conflicts.
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update Browserslist
        uses: c2corg/browserslist-update-action@v2.5.0
        with:
          github_token: ${{ secrets.DEPS_PR_TOKEN || secrets.GITHUB_TOKEN }}
          base_branch: main

      # The ruleset has no required status checks, so `gh pr merge --auto` would merge at
      # once. Wait for the PR's checks to pass instead, then squash-merge (branch is
      # deleted by the repo's auto-delete setting). No PR means nothing changed.
      - name: Merge once checks pass
        env:
          GH_TOKEN: ${{ secrets.DEPS_PR_TOKEN || secrets.GITHUB_TOKEN }}
        timeout-minutes: 30
        run: |
          pr=$(gh pr list --head browserslist-update --state open --json number -q '.[0].number')
          [ -n "$pr" ] || { echo "No open PR, nothing to merge"; exit 0; }
          sleep 30 # let the PR's checks register
          gh pr checks "$pr" --watch --fail-fast
          gh pr merge "$pr" --squash

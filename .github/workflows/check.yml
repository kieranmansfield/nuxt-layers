name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .node-version
          cache: true
      - name: Format + Oxlint
        run: vp check
      # Same as `pnpm lint`: per-package eslint via turbo. A root-level `eslint .` lints
      # markdown docs and files outside any tsconfig, which the repo doesn't expect.
      - name: ESLint (Vue/Nuxt rules)
        run: vp run lint
      - name: Stylelint
        run: vp exec stylelint "**/*.{vue,css}" --ignore-path .gitignore
      # Advisory for now: the repo has existing findings (core/typography/theming cycles,
      # a stale suppression). Drop continue-on-error once they're cleaned up.
      - name: Dead code (fallow)
        continue-on-error: true
        run: vp dlx fallow dead-code

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .node-version
          cache: true
      - run: vp run typecheck

  test:
    name: Unit & Nuxt tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .node-version
          cache: true
      - run: vp test run --coverage

  hydration:
    name: Hydration (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .node-version
          cache: true
      - run: vp exec playwright install --with-deps chromium
      - run: vp exec playwright test hydration.spec.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .node-version
          cache: true
      - run: vp run build

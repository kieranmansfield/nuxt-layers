name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - name: Format + Oxlint
        run: vp check
      # Content markdown is excluded from oxfmt; Comark (the formatter Nuxt Studio uses) owns it.
      - name: Content markdown (Comark)
        run: vp run content:format:check
      # Same as `pnpm lint`: per-package eslint via `vp run`. A root-level `eslint .` lints
      # markdown docs and files outside any tsconfig, which the repo doesn't expect.
      - name: ESLint (Vue/Nuxt rules)
        run: vp run lint
      - name: Stylelint
        run: vp exec stylelint "**/*.{vue,css}" --ignore-path .gitignore
      # Advisory for now: the repo has existing findings (core/typography/theming cycles,
      # a stale suppression). Drop continue-on-error once they're cleaned up.
      # Full-repo report. `vp exec` uses the catalog-pinned fallow, not a fresh dlx download.
      - name: Dead code (fallow)
        continue-on-error: true
        run: vp exec fallow dead-code

  fallow-audit:
    name: Fallow audit (PR diff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # audit diffs against, and snapshots, the base branch
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      # Blocking, unlike the full report above: the default new-only gate fails only on dead
      # code, complexity or duplication this PR introduces (baselines from .fallowrc.json).
      - name: Fallow audit
        env:
          BASE_REF: ${{ github.base_ref }}
        run: vp exec fallow audit --changed-since "origin/$BASE_REF" --quiet

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - run: vp run typecheck

  test:
    name: Unit & Nuxt tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - run: vp test run --coverage

  hydration:
    name: Hydration (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - run: vp exec playwright install --with-deps chromium
      - run: vp exec playwright test hydration.spec.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - run: vp run build

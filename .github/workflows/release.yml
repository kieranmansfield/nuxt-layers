name: Release

# Runs when a dependency-update PR is squash-merged to main (feat(deps) -> minor,
# fix(deps) -> patch), or manually. Bumps the version, tags, creates the GitHub release and publishes to npm.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'fix(deps)') || startsWith(github.event.head_commit.message, 'feat(deps)')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      # release.mjs: check, bump, commit, tag, push, gh release create.
      - run: node scripts/release.mjs ${{ inputs.bump || (startsWith(github.event.head_commit.message, 'feat(deps)') && 'minor') || 'patch' }}
        env:
          GH_TOKEN: ${{ github.token }}
      # A release created with GITHUB_TOKEN doesn't fire npm-publish.yml, so publish here.
      - run: pnpm publish --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
